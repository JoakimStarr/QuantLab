ai_provider:
  cache_ttl: day
  fallback:
    base_url: https://open.bigmodel.cn/api/paas/v4
    max_tokens: 2048
    model: glm-4-flash
    provider: glm
    temperature: 0.3
    timeout_seconds: 30
  force_json_output: true
  primary:
    base_url: https://opencode.ai/zen/v1/
    max_tokens: 8192
    model: deepseek-v4-flash-free
    provider: opencodezen
    temperature: 0.3
    timeout_seconds: 60
  retry_times: 1
  route_budget_seconds: 120
  tertiary:
    base_url: https://api.siliconflow.cn/v1
    max_tokens: 2048
    model: Qwen/Qwen2.5-7B-Instruct
    provider: siliconflow
    temperature: 0.3
    timeout_seconds: 20
  total_timeout_seconds: 10
api:
  request_timeout: 30
  version: v1
app:
  debug: false
  description: 自用量化研究工具 - 因子挖掘、回测与策略管理
  name: QuantLab
  timezone: Asia/Shanghai
  version: 3.0.2
data:
  models_dir: models
  processed_dir: data/processed
  raw_dir: data/raw
logging:
  dir: logs
  handlers:
    api:
      filename: api.jsonl
      format: json
    app:
      backup_count: 30
      filename: app.log
      max_bytes: 10485760
    audit:
      filename: audit.jsonl
      format: json
    error:
      filename: error.log
      level: ERROR
    perf:
      filename: perf.jsonl
      format: json
  level: INFO
mining:
  automl:
    combo_method: lightgbm
  llm:
    allowed_ops:
    - Ref
    - Mean
    - Std
    - Max
    - Min
    - Sum
    - Rank
    - Corr
    - Cov
    - Delta
    - Slope
    - Resi
    - WMA
    - EMA
    - $close
    - $open
    - $high
    - $low
    - $volume
    - $factor
    candidates_per_run: 10
    diversity_max_factors: 20
    eval_timeout_seconds: 60
    ic_threshold: 0.03
    significance_alpha: 0.05
  symbolic:
    generations: 30
    ic_threshold: 0.03
    parsimony_coefficient: 0.001
    population: 1000
    tournament_size: 20
    init_depth: [2, 4]
  text:
    max_news_per_day: 50
    sentiment_labels:
    - positive
    - neutral
    - negative
quant:
  adjust: qfq
  benchmark: SH000300
  cost_buy: 0.0013
  cost_sell: 0.0023
  data_source: baostock
  backfill_years: 5
  default_backtest_period:
    end: '2024-12-31'
    start: '2020-01-01'
  fetch_interval_seconds: 1.2
  fetch_max_workers: 3
  include_bj: false
  n_drop: 5
  qlib_provider_uri: data/qlib_bin/cn_data
  slippage_bps: 5
  sync_indices:
  - sh000001
  - sh000300
  - sh000016
  - sh000905
  - sh000852
  - sz399001
  - sz399006
  - sh000688
  topk: 50
  universe: csi300
scheduler:
  quant_data_update_time: '18:00'
task:
  cpu_workers: 4
  io_workers: 8
  max_concurrent: 2
  task_timeout_seconds: 300
  timeouts:
    automl: 600
    llm: 300
    llm_hard_limit_seconds: 7200
    optimize: 600
    symbolic: 1800
    text: 900
