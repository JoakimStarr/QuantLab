ai_provider:
  cache_ttl: day
  # 顺序 fallback：primary 失败后逐个尝试，避免免费模型超时占用预算
  fallback:
    base_url: https://open.bigmodel.cn/api/paas/v4
    max_tokens: 2048
    model: glm-4-flash
    provider: glm
    temperature: 0.3
    timeout_seconds: 30
  force_json_output: true
  primary:
    base_url: https://opencode.ai/zen/v1/
    max_tokens: 8192
    model: deepseek-v4-flash-free
    provider: opencodezen
    temperature: 0.3
    timeout_seconds: 60
  retry_times: 1
  tertiary:
    base_url: https://api.siliconflow.cn/v1
    max_tokens: 2048
    model: Qwen/Qwen2.5-7B-Instruct
    provider: siliconflow
    temperature: 0.3
    timeout_seconds: 20
  total_timeout_seconds: 10
  route_budget_seconds: 120          # ProviderRouter 多 provider 总预算，避免重试吃光任务超时
api:
  request_timeout: 30
  version: v1
app:
  debug: false
  description: 自用量化研究工具 - 因子挖掘、回测与策略管理
  name: QuantLab
  timezone: Asia/Shanghai
  version: 0.9.0-beta.1
data:
  db_path: data/quantlab.db
  models_dir: models
  processed_dir: data/processed
  raw_dir: data/raw
logging:
  dir: logs
  handlers:
    api:
      filename: api.jsonl
      format: json
    app:
      backup_count: 30
      filename: app.log
      max_bytes: 10485760
    audit:
      filename: audit.jsonl
      format: json
    error:
      filename: error.log
      level: ERROR
    perf:
      filename: perf.jsonl
      format: json
  level: INFO
mining:
  automl:
    combo_method: lightgbm
  llm:
    allowed_ops:
    - Ref
    - Mean
    - Std
    - Max
    - Min
    - Sum
    - Rank
    - Corr
    - Cov
    - Delta
    - Slope
    - Resi
    - WMA
    - EMA
    - $close
    - $open
    - $high
    - $low
    - $volume
    - $factor
    candidates_per_run: 10
    ic_threshold: 0.03
    eval_timeout_seconds: 60          # 单因子 IC 评价超时，超时跳过该因子
  symbolic:
    generations: 30
    ic_threshold: 0.03
    parsimony_coefficient: 0.001
    population: 1000
    tournament_size: 20
  text:
    max_news_per_day: 50
    sentiment_labels:
    - positive
    - neutral
    - negative
quant:
  adjust: qfq
  benchmark: SH000300
  cost_buy: 0.0013
  cost_sell: 0.0023
  slippage_bps: 5            # 滑点（基点），0=关闭。买入按+slippage成交，卖出按-slippage
  data_source: akshare
  default_backtest_period:
    end: '2024-12-31'
    start: '2020-01-01'
  fetch_interval_seconds: 1.2
  fetch_max_workers: 3
  include_bj: false
  n_drop: 5
  portfolio_optimizer:
    enabled: false
    max_industry_exposure: 0.2
    max_weight: 0.05
    method: mean_variance       # max_return / min_tracking_error / mean_variance（max_sharpe 为 mean_variance 别名）
    risk_aversion: 0.5          # 均值-方差风险厌恶系数，越大越保守
  qlib_provider_uri: data/qlib_bin/cn_data
  topk: 50
  universe: csi300
scheduler:
  quant_data_update_time: '18:00'
task:
  max_concurrent: 2
  cpu_workers: 4              # CPU 进程池大小（因子评价/CV 训练真并行）
  io_workers: 8               # IO 线程池大小（akshare/qlib 同步数据读取）
  task_timeout_seconds: 300          # 默认超时（兼容旧配置）
  timeouts:
    llm: 300                         # LLM 单轮挖掘（仅 task_type 兜底用，实际走 llm_hard_limit_seconds）
    # LLM 挖掘不限时：依赖内部原子超时（provider timeout + eval_timeout）+ 硬上限兜底
    # 理由：LLM 耗时不可控（推理模型/provider 排队/网络），固定超时易误杀正常任务
    llm_hard_limit_seconds: 7200     # LLM 挖掘硬上限（默认 2h 防极端卡死；设 0 = 完全无限）
    symbolic: 1800                   # 1000×30 GP 需要长超时
    text: 900                        # 30 股串行抓新闻 + LLM 情绪
    automl: 600                      # AutoML 训练 + SHAP
    optimize: 600                    # 因子优化（含 walk-forward 评价）
