ai_provider:
  cache_ttl: day
  fallback:
    base_url: https://open.bigmodel.cn/api/paas/v4
    max_tokens: 2048
    model: glm-4-flash
    provider: glm
    temperature: 0.3
    timeout_seconds: 30
  force_json_output: true
  primary:
    base_url: https://opencode.ai/zen/v1/
    # deepseek-v4-flash-free 是推理模型：reasoning 内容先吃预算，8192 会被推理耗尽
    # 导致正式输出为空（曾实测 reasoning 24k+ tokens）。32768 留足推理+回答空间。
    max_tokens: 32768
    model: deepseek-v4-flash-free
    provider: opencodezen
    temperature: 0.3
    # 推理模型长思维链单次调用可达数分钟，60s 太紧（曾实测 ~50-60s 仍算超时）
    timeout_seconds: 180
  retry_times: 1
  route_budget_seconds: 360
  tertiary:
    base_url: https://api.siliconflow.cn/v1
    max_tokens: 2048
    model: Qwen/Qwen2.5-7B-Instruct
    provider: siliconflow
    temperature: 0.3
    timeout_seconds: 20
  total_timeout_seconds: 10
api:
  request_timeout: 30
  version: v1
app:
  debug: false
  description: 自用量化研究工具 - 因子挖掘、回测与策略管理
  name: QuantLab
  timezone: Asia/Shanghai
  version: 3.0.2
data:
  models_dir: models
  processed_dir: data/processed
  raw_dir: data/raw
logging:
  dir: logs
  level: INFO
  # 日志定期清理：普通日志(quantlab.log/sync.log)轮转备份保留天数
  retention_days: 7
  # 错误日志(error.log)备份保留天数（更长，清理后仍可定位历史错误）
  error_retention_days: 15
  cleanup_enabled: true
# 蒙特卡罗模拟（回测指标 bootstrap 置信区间 + 因子 IC 置换检验）
monte_carlo:
  bootstrap_iterations: 1000
  # stationary bootstrap 平均块长（交易日）
  bootstrap_block: 20
  # 置信水平（0.9 → [5%, 95%]）
  bootstrap_ci: 0.9
  # 因子 IC 置换检验次数 / 显著性水平（深度分析页展示，不拦截挖掘）
  permutation_n: 500
  permutation_alpha: 0.05
mining:
  automl:
    combo_method: lightgbm
  # 政策风向 AI 解读（policy_ai）：LLM 并发与失败重试上限
  policy_ai:
    concurrency: 4
    max_retry: 3
  llm:
    # AI 策略选因子的达标阈值（区别于 ic_threshold=0.03 的挖掘线，
    # A 股截面 IC 0.02-0.03 已可用，用 0.03 达标池过小 AI 无法生成策略）
    strategy_ic_threshold: 0.02
    allowed_ops:
    - Ref
    - Mean
    - Std
    - Max
    - Min
    - Sum
    - Rank
    - Corr
    - Cov
    - Delta
    - Slope
    - Resi
    - WMA
    - EMA
    - Log
    - Abs
    - Sign
    - If
    - $open
    - $high
    - $low
    - $close
    - $preclose
    - $volume
    - $amount
    - $turn
    - $pct_chg
    - $change
    - $tradable
    - $pe_ttm
    - $pb_mrq
    - $ps_ttm
    - $pcf_ncf_ttm
    # 季频财报字段（fundamental_sync PIT 广播后可用）
    - $netprofit
    - $revenue
    - $netprofit_deduct
    - $roe
    - $roa
    - $gross_margin
    - $net_margin
    - $debt_ratio
    - $ocf
    - $eps
    - $bvps
    - $revenue_yoy
    - $netprofit_yoy
    - $ocf_to_np
    - $current_ratio
    - $quick_ratio
    - $equity_multiplier
    candidates_per_run: 10
    # 多样性对比的已有因子上限：过小会漏检（达标因子超过上限后不再对比）。
    # 200 覆盖常见因子库规模；IC 序列计算带 web 进程缓存，不会显著拖慢挖掘。
    diversity_max_factors: 200
    # 单候选多维验证超时：评价含 5 年数据加载/分段IC/滚动重验，60s 过紧（大候选集
    # 排队时更会被耗光）。配合 llm_factor 的信号量限并发，超时只计实际执行时间。
    eval_timeout_seconds: 300
    # 挖掘达标阈值与策略选因阈值（strategy_ic_threshold=0.02）统一：A股截面 IC 0.02
    # 已可用，0.03 门槛过高导致挖掘产出几乎无法入库、也过不了策略选因口径。
    ic_threshold: 0.02
    significance_alpha: 0.05
  symbolic:
    generations: 30
    ic_threshold: 0.02
    parsimony_coefficient: 0.001
    population: 1000
    tournament_size: 20
    init_depth: [2, 4]
  text:
    max_news_per_day: 50
    sentiment_labels:
    - positive
    - neutral
    - negative
quant:
  adjust: qfq
  benchmark: SH000300
  cost_buy: 0.0013
  cost_sell: 0.0023
  data_source: baostock
  backfill_years: 5
  default_backtest_period:
    end: '2024-12-31'
    start: '2020-01-01'
  fetch_interval_seconds: 1.2
  fetch_max_workers: 3
  include_bj: false
  n_drop: 5
  qlib_provider_uri: data/qlib_bin/cn_data
  slippage_bps: 5
  sync_indices:
  - sh000001
  - sh000300
  - sh000016
  - sh000905
  - sh000852
  - sz399001
  - sz399006
  - sh000688
  topk: 50
  universe: csi300
scheduler:
  quant_data_update_time: '18:00'
task:
  cpu_workers: 4
  io_workers: 8
  max_concurrent: 2
  task_timeout_seconds: 300
  timeouts:
    automl: 600
    llm: 1800
    llm_hard_limit_seconds: 7200
    optimize: 600
    symbolic: 1800
    text: 900
