services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantlab}
      POSTGRES_DB: ${POSTGRES_DB:-quantlab}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantlab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      # 生产：前端构建产物由 CI 构建后挂载；开发时在 frontend/ 下 `npm run dev`
      - ./frontend/dist:/app/static:ro
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      - STATIC_DIR=/app/static
      - TZ=Asia/Shanghai
      # 数据库连接：与 postgres 服务联通
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quantlab}:${POSTGRES_PASSWORD:-quantlab}@postgres:5432/${POSTGRES_DB:-quantlab}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  postgres_data:

# 前端由 FastAPI 通过 StaticFiles 直接服务（需先 `cd frontend && npm run build`）。
# 如需前端热更新开发，在 frontend/ 目录下单独运行 `npm run dev`。