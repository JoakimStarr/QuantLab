name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          cd backend
          pip install ruff
          # ruff 取代 flake8（同款 pyproject.toml 配置，line-length=120）。
          # 注意：app/ 存在历史遗留风格基线（~248 条 I001/UP/B 等，均非本改动引入），
          # 一次性清理超出本任务范围，先以 --exit-zero 通告模式运行（输出在 CI 日志可见），
          # 基线清零后去掉 --exit-zero 即为硬门禁。
          ruff check app/ --exit-zero --output-format=concise
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint
          npm run check:vue
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantlab
          POSTGRES_PASSWORD: quantlab
          POSTGRES_DB: quantlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=quantlab psql -h localhost -U quantlab -d quantlab \
            -c 'CREATE DATABASE quantlab_test'
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        env:
          # 测试专用库（conftest 仅对库名含 "test" 的库做 drop_all/TRUNCATE 清理）
          DATABASE_URL: postgresql+asyncpg://quantlab:quantlab@localhost:5432/quantlab_test
          APP_ENV: test
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=60 -x 2>&1 | tail -50
